<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tuckshop Express POS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1E1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>

    <!-- TOP BAR: Status & Mode Switching -->
    <header class="app-header">
        <div class="brand">
            <span class="shop-title">TUCKSHOP POS</span>
            <span id="sync-badge" class="sync-badge offline">OFFLINE</span>
        </div>
        <div class="mode-toggle">
            <button id="btn-toggle-mode" class="btn-mode">QUIET MODE</button>
        </div>
    </header>

    <!-- RUSH HOUR VIEW (DEFAULT) -->
    <main id="rush-hour-view" class="view active-view">

        <!-- QUIET MODE VIEW (Restocking & Rate Management) -->
<main id="quiet-mode-view" class="view hidden">
    <!-- SECTION 4: STOCK INTAKE & RECEIVING GOODS -->
<section class="quiet-card">
    <h2 class="section-title">📦 Receive Stock (Suppliers & Conditions)</h2>
    <form id="form-stock-intake" class="intake-form">
        
        <div class="form-group">
            <label>Select Product</label>
            <select id="intake-product-select" class="form-control" required>
                <!-- Populated via JS -->
            </select>
        </div>

        <div class="form-group">
            <label>Supplier Name</label>
            <input type="text" id="intake-supplier-name" class="form-control" placeholder="e.g. Bakers Inn, Mega Market" required />
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Unit Cost ($ USD)</label>
                <input type="number" step="0.01" id="intake-unit-cost" class="form-control" placeholder="0.80" />
            </div>
            <div class="form-group">
                <label class="label-success">Good Qty (To Stock)</label>
                <input type="number" id="intake-qty-good" class="form-control highlight-success" placeholder="0" />
            </div>
        </div>

        <div class="form-row-3">
            <div class="form-group">
                <label class="label-danger">Damaged Qty</label>
                <input type="number" id="intake-qty-damaged" class="form-control" placeholder="0" />
            </div>
            <div class="form-group">
                <label class="label-danger">Expired Qty</label>
                <input type="number" id="intake-qty-expired" class="form-control" placeholder="0" />
            </div>
            <div class="form-group">
                <label class="label-danger">Short Qty</label>
                <input type="number" id="intake-qty-short" class="form-control" placeholder="0" />
            </div>
        </div>

        <button type="button" id="btn-submit-intake" class="btn-primary-full">LOG STOCK INTAKE</button>
    </form>
</section>

<!-- SECTION 5: DAILY OPERATING EXPENSES -->
<section class="quiet-card">
    <h2 class="section-title">💸 Record Shop Expense / Loss</h2>
    <form id="form-shop-expense" class="intake-form">
        
        <div class="form-row-2">
            <div class="form-group">
                <label>Category</label>
                <select id="expense-category-select" class="form-control" required>
                    <option value="">-- Select --</option>
                    <option value="RENT">Rent</option>
                    <option value="FUEL_GENERATOR">Fuel / Generator</option>
                    <option value="TRANSPORT">Transport / Restock Travel</option>
                    <option value="COUNCIL_LEVIES">Council Levies / Taxes</option>
                    <option value="DAMAGED_EXPIRED_STOCK">Damaged / Expired Stock</option>
                    <option value="OTHER">Other Expenses</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount ($ USD)</label>
                <input type="number" step="0.01" id="expense-amount-usd" class="form-control" placeholder="0.00" required />
            </div>
        </div>

        <div class="form-group">
            <label>Notes / Reason</label>
            <input type="text" id="expense-notes" class="form-control" placeholder="e.g. 5L Diesel for generator or Rats ate 2 loaves" />
        </div>

        <button type="button" id="btn-submit-expense" class="btn-warning-full">LOG EXPENSE</button>
    </form>
</section>

    <div class="quiet-container">
        
        <!-- SECTION 1: DAILY EXCHANGE RATES -->
        <section class="quiet-card">
            <h2 class="section-title">Today's Exchange Rates (per $1 USD)</h2>
            <div id="rate-inputs-container" class="rates-grid">
                <!-- Dynamically Populated by quiet-mode.js -->
            </div>
            <button id="btn-save-rates" class="btn-success-full">UPDATE RATES</button>
        </section>

        <!-- SECTION 2: CHIKWERETI DEBT SUMMARY -->
        <section class="quiet-card debt-card">
            <div class="debt-info">
                <span>Total Outstanding Credit:</span>
                <strong id="total-unpaid-debt">$0.00 USD</strong>
            </div>
        </section>

        <!-- SECTION 3: STOCK RECONCILIATION TABLE -->
        <section class="quiet-card">
            <h2 class="section-title">Inventory Restock & Reconciliation</h2>
            <div class="table-wrapper">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>USD Price</th>
                            <th>Stock Count</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body">
                        <!-- Dynamically Populated by quiet-mode.js -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>
</main>

        
        <!-- PRODUCT GRID (Big Touch Tiles) -->
        <section class="grid-container" id="product-grid">
            <!-- Dynamic Tiles Generated by JS (4x3 Grid) -->
            <!-- Example Template:
            <button class="tile" data-id="prod_1">
                <span class="tile-title">BREAD</span>
                <span class="tile-price">$1.00</span>
                <span class="tile-stock">Stock: 42</span>
            </button> 
            -->
        </section>

        <!-- BOTTOM THUMB ZONE (Rule 1: Everything reachable with one thumb) -->
        <footer class="thumb-zone">
            <div class="running-total-bar">
                <div class="item-count"><span id="cart-count">0</span> items</div>
                <div class="currency-display">
                    <span id="cart-usd">$0.00</span>
                    <span id="cart-zig" class="sub-zig">0.00 ZiG</span>
                </div>
            </div>

            <div class="action-buttons-row">
                <button id="btn-clear-cart" class="btn-danger">CLEAR</button>
                <button id="btn-complete-sale" class="btn-primary-large">COMPLETE SALE</button>
            </div>
        </footer>

    </main>

    <!-- CHECKOUT MODAL (MULTI-CURRENCY / CREDIT) -->
    <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Select Payment</h2>
            <div class="modal-amount" id="modal-due-usd">$0.00 USD</div>
            
            <div class="payment-options">
                <button class="btn-payment" data-method="USD_CASH">💵 USD Cash</button>
                <button class="btn-payment" data-method="ZiG_ECOCASH">📱 ZiG EcoCash</button>
                <button class="btn-payment btn-warning" id="btn-credit-sale">🤝 Chikwereti (Credit)</button>
            </div>

            <button id="btn-close-modal" class="btn-cancel">Back</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
